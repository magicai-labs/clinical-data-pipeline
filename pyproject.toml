[project]
name = "clinpipe"
version = "0.6.2"
description = "A research-grade pipeline linking PubChem compounds with ClinicalTrials.gov study data"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "clinical-trials",
  "clinicaltrials-gov",
  "pubchem",
  "bioinformatics",
  "drug-discovery",
  "data-pipeline",
  "research-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "requests>=2.31",
  "tenacity>=8.2"
]

[project.urls]
Homepage = "https://github.com/magicai-labs/clinical-data-pipeline"
Repository = "https://github.com/magicai-labs/clinical-data-pipeline"
Documentation = "https://github.com/magicai-labs/clinical-data-pipeline/tree/main/docs"
Issues = "https://github.com/magicai-labs/clinical-data-pipeline/issues"
Changelog = "https://github.com/magicai-labs/clinical-data-pipeline/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # E/F: 기본 오류, I: import 정렬

[tool.pytest.ini_options]
markers = [
  "smoke: quick smoke tests",
  "network: tests requiring network access",
  "timeout: per-test timeout (pytest-timeout)",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1"
]

[project.scripts]
clinpipe = "clinpipe.cli:main"
clinical-data-analyzer = "clinical_data_analyzer.cli:main"
